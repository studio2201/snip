name: 'Snip Vibe-Code Security Gate'
description: 'Audits code diffs and files for credentials, CORS, and Supabase RLS'
author: 'studio2201'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'File, patch, or directory to audit (defaults to staged/PR diff)'
    required: false
    default: '.'
  format:
    description: 'Output format (markdown, text, json, cursor)'
    required: false
    default: 'markdown'

runs:
  using: 'composite'
  steps:
    - name: Bootstrap snip (pinned v0.2.12 + SHA-256)
      shell: bash
      run: |
        DEST="${XDG_BIN_HOME:-$HOME/.local/bin}"
        mkdir -p "$DEST"
        if ! command -v snip >/dev/null 2>&1; then
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64) TARGET="x86_64-unknown-linux-musl" ;;
            Darwin-arm64|Darwin-aarch64) TARGET="aarch64-apple-darwin" ;;
            *) echo "::error::Unsupported runner platform $(uname -s)-$(uname -m) (supported: Linux x86_64, macOS arm64)"; exit 1 ;;
          esac
          ASSET="snip-${TARGET}.tar.gz"
          URL="https://github.com/studio2201/snip/releases/download/v0.2.12/${ASSET}"
          curl -fsSL --retry 3 "$URL" -o "$TMP/$ASSET"
          curl -fsSL --retry 3 "${URL}.sha256" -o "$TMP/${ASSET}.sha256"
          EXPECTED=$(awk '{print $1}' "$TMP/${ASSET}.sha256")
          [[ "$EXPECTED" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid SHA-256 for $ASSET"; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$TMP" && printf '%s  %s\n' "$EXPECTED" "$ASSET" | sha256sum --strict --check -)
          else
            (cd "$TMP" && printf '%s  %s\n' "$EXPECTED" "$ASSET" | shasum -a 256 --check -)
          fi
          tar -xzf "$TMP/$ASSET" -C "$DEST" snip && chmod 755 "$DEST/snip"
        fi
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Run Snip Diff Audit
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FORMAT: ${{ inputs.format }}
      run: |
        export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
        TARGET="$INPUT_PATH"
        set +e
        if [ "$TARGET" != "." ] && [ -f "$TARGET" ]; then
          snip audit "$TARGET" --format "$INPUT_FORMAT" > snip_summary.md 2>&1
          EC=$?
        else
          DIFF=""
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            DIFF=$(git diff "origin/$GITHUB_BASE_REF...HEAD" 2>/dev/null || true)
          fi
          [ -z "$DIFF" ] && DIFF=$(git diff HEAD~1 2>/dev/null || true)
          [ -z "$DIFF" ] && DIFF=$(git diff --staged 2>/dev/null || true)
          [ -z "$DIFF" ] && DIFF="No diff additions detected."
          printf '%s\n' "$DIFF" | snip --format "$INPUT_FORMAT" > snip_summary.md 2>&1
          EC=$?
        fi
        set -e

        STATUS="🟢 SHIP"
        BADGE="https://img.shields.io/badge/Snip-SHIP-brightgreen"
        if [ $EC -ne 0 ]; then
          STATUS="🔴 BLOCK"
          BADGE="https://img.shields.io/badge/Snip-BLOCK-red"
        fi

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## ✂️ Snip Vibe-Code Security Gate"
            echo ""
            echo "| Status | Target | Badge |"
            echo "| :---: | :---: | :---: |"
            echo "| **${STATUS}** | \`${TARGET}\` | ![Snip](${BADGE}) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cat snip_summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $EC
