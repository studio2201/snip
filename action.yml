name: 'Snip Vibe-Code Security Gate'
description: 'Audits code diffs and files for credentials, CORS, and Supabase RLS'
author: 'studio2201'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'File, patch, or directory to audit (defaults to staged/PR diff)'
    required: false
    default: '.'
  format:
    description: 'Output format (markdown, text, json, cursor)'
    required: false
    default: 'markdown'

runs:
  using: 'composite'
  steps:
    - name: Fast Bootstrap snip
      shell: bash
      run: |
        DEST="${XDG_BIN_HOME:-$HOME/.local/bin}"
        mkdir -p "$DEST"
        if ! command -v snip >/dev/null 2>&1; then
          if [ -f "${{ github.action_path }}/../install.sh" ]; then
            sh "${{ github.action_path }}/../install.sh" --dest "$DEST" snip
          elif [ -f "${{ github.action_path }}/install.sh" ]; then
            sh "${{ github.action_path }}/install.sh" --dest "$DEST" snip
          else
            curl -fsSL --retry 3 https://studio2201.com/install.sh | sh -s -- --dest "$DEST" snip
          fi
        fi
        echo "$DEST" >> "$GITHUB_PATH"

    - name: Run Snip Diff Audit
      shell: bash
      run: |
        export PATH="${XDG_BIN_HOME:-$HOME/.local/bin}:$PATH"
        TARGET="${{ inputs.path }}"
        set +e
        if [ "$TARGET" != "." ] && [ -f "$TARGET" ]; then
          snip audit "$TARGET" --format "${{ inputs.format }}" > snip_summary.md 2>&1
          EC=$?
        else
          DIFF=""
          if [ -n "$GITHUB_BASE_REF" ]; then
            DIFF=$(git diff "origin/$GITHUB_BASE_REF...HEAD" 2>/dev/null || true)
          fi
          [ -z "$DIFF" ] && DIFF=$(git diff HEAD~1 2>/dev/null || true)
          [ -z "$DIFF" ] && DIFF=$(git diff --staged 2>/dev/null || true)
          [ -z "$DIFF" ] && DIFF="No diff additions detected."
          echo "$DIFF" | snip --format "${{ inputs.format }}" > snip_summary.md 2>&1
          EC=$?
        fi
        set -e

        STATUS="🟢 SHIP"
        BADGE="https://img.shields.io/badge/Snip-SHIP-brightgreen"
        if [ $EC -ne 0 ]; then
          STATUS="🔴 BLOCK"
          BADGE="https://img.shields.io/badge/Snip-BLOCK-red"
        fi

        if [ -n "$GITHUB_STEP_SUMMARY" ]; then
          {
            echo "## ✂️ Snip Vibe-Code Security Gate"
            echo ""
            echo "| Status | Target | Badge |"
            echo "| :---: | :---: | :---: |"
            echo "| **${STATUS}** | \`${TARGET}\` | ![Snip](${BADGE}) |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cat snip_summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
        exit $EC
